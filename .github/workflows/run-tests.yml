name: Run Go Tests

on:
  push:
    branches: [ 
        "main",
        "feat/**",
        "fix/**",
        "test/**",
        "docs/**",
        "chore/**",
        "refactor/**",
        "style/**",
        "perf/**",
        "ci/**",
        "build/**",
        "release/**",
    ]
  pull_request:
    branches: [
        "main",
        "feat/**",
        "fix/**",
        "test/**",
        "docs/**",
        "chore/**",
        "refactor/**",
        "style/**",
        "perf/**",
        "ci/**",
        "build/**",
        "release/**",
    ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.24

    - name: Format
      run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './web-ui/*'))"

    # O repositório tem um go.mod por módulo (núcleo, adaptadores, exemplos).
    # Cada um é verificado separadamente.
    - name: Build, vet and test every module
      run: |
        set -e
        for mod in $(find . -name go.mod -not -path './web-ui/*' -exec dirname {} \; | sort); do
          echo "::group::$mod"
          (cd "$mod" && go vet ./... && go build ./... && go test -count=1 -cover ./...)
          echo "::endgroup::"
        done
